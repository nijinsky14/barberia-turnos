<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LUCK BARBER Admin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a1a;
            --accent: #d4af37;
            --text: #333;
            --text-light: #666;
            --bg: #ffffff;
            --bg-light: #f8f8f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: var(--accent);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent) 0%, #c4991f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .mensaje {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .mensaje-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .mensaje-exito {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #999;
            font-size: 0.85rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-light);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem;
            }

            .logo h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1 id="logoHeading">✂️ LUCK BARBER</h1>
            <p>Panel de Administración</p>
        </div>

        <div id="mensaje"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" required autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <div class="password-toggle">
                    <input type="password" id="contrasena" required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePassword()">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                Iniciar Sesión
            </button>
        </form>

        <div class="footer">
            <p id="footerText">© 2025 LUCK BARBER - Sistema Seguro</p>
        </div>
    </div>

    <script src="/js/negocio-config.js"></script>
    <script>
        const API_URL = window.location.origin;

        function mostrarMensaje(texto, tipo) {
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.className = `mensaje mensaje-${tipo}`;
            mensajeDiv.textContent = texto;
            mensajeDiv.style.display = 'block';
        }

        function togglePassword() {
            const passwordInput = document.getElementById('contrasena');
            const btn = event.target;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                btn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Verificar si ya está autenticado
        async function verificarSesion() {
            try {
                const response = await fetch(`${API_URL}/api/auth/verificar`);
                if (response.ok) {
                    window.location.href = '/admin.html';
                }
            } catch (error) {
                console.log('No hay sesión activa');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btnLogin = document.getElementById('btnLogin');
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="loading"></span> Verificando...';

            const datos = {
                usuario: document.getElementById('usuario').value,
                contrasena: document.getElementById('contrasena').value
            };

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                const resultado = await response.json();

                if (response.ok && resultado.exitoso) {
                    mostrarMensaje('✓ Login exitoso. Redirigiendo...', 'exito');
                    
                    setTimeout(() => {
                        window.location.href = '/admin.html';
                    }, 1000);
                } else {
                    mostrarMensaje('✗ ' + (resultado.mensaje || 'Credenciales incorrectas'), 'error');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Iniciar Sesión';
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('✗ Error al conectar con el servidor', 'error');
                btnLogin.disabled = false;
                btnLogin.textContent = 'Iniciar Sesión';
            }
        });

        // Cargar configuración del negocio (nombre para título, encabezado y footer)
        async function inicializarNegocio() {
            try {
                const negocio = await cargarConfigNegocio();
                document.title = `Login - ${negocio.nombre} Admin`;

                const logoHeading = document.getElementById('logoHeading');
                if (logoHeading) logoHeading.textContent = `✂️ ${negocio.nombre}`;

                const footerText = document.getElementById('footerText');
                if (footerText) {
                    footerText.textContent = footerText.textContent.replace('LUCK BARBER', negocio.nombre);
                }
            } catch (error) {
                console.error('Error cargando configuración del negocio:', error);
            }
        }

        // Verificar sesión al cargar la página
        verificarSesion();
        inicializarNegocio();

        // Enter para enviar formulario
        document.getElementById('contrasena').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
